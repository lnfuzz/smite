[package]
name = "ldk-node-wrapper"
version = "0.0.0"
edition = "2024"

[profile.release]
# Skip stack unwinding on panics so that the crash handler has time to report
# the crash before the snapshot gets reset.
panic = "abort"

[dependencies]
ldk-node = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[workspace.lints.rust]
warnings = "deny"
